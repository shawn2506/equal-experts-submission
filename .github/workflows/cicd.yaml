name: CICD Pipeline
on:
  push:
    branches:
      - alpha
jobs:
  build-code:
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt